name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Check npm authentication
        if: ${{ !inputs.dry_run }}
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Preview package contents
        run: npm pack --dry-run
      - name: Publish package
        if: ${{ !inputs.dry_run }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          published_version="$(npm view "$package_name@$package_version" version 2>/dev/null || true)"
          if [ "$published_version" = "$package_version" ]; then
            echo "$package_name@$package_version is already published"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public package access
        if: ${{ !inputs.dry_run }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          access_status="$(npm access get status "$package_name" --json)"
          echo "$access_status"
          node --input-type=module -e '
            const status = JSON.parse(process.argv[1]);
            const packageName = process.argv[2];
            if (status !== "public" && status[packageName] !== "public") process.exit(1);
          ' "$access_status" "$package_name"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
