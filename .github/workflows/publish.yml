name: Publish release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without publishing
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: chartmd-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Validate release tag
        if: github.ref_type == 'tag'
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack once for both registries and release download
        run: |
          mkdir -p release
          npm pack --json --pack-destination release > release/pack.json
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
      - name: Publish to npm
        if: github.event_name == 'push' || !inputs.dry_run
        run: node scripts/publish-registry.mjs https://registry.npmjs.org/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/setup-node@v4
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@leracherry'
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' || !inputs.dry_run
        run: node scripts/publish-registry.mjs https://npm.pkg.github.com/
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release and upload package
        if: github.event_name == 'push' || !inputs.dry_run
        run: node scripts/github-release.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
