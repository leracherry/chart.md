<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chart.md · A document with data</title>
    <style>
      :root {
        color-scheme: light;
        --page: #fff;
        --ink: #24292f;
        --muted: #656d76;
        --border: #d1d9e0;
        --soft: #f6f8fa;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --page: #161b22;
        --ink: #e6edf3;
        --muted: #a1aab5;
        --border: #39424e;
        --soft: #202731;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font:
          16px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 20px 0;
        border-bottom: 1px solid var(--border);
      }
      header strong {
        font-size: 18px;
        font-weight: 600;
      }
      .shell {
        max-width: 920px;
        margin: auto;
        padding: 0 32px;
      }
      main {
        max-width: 760px;
        margin: 56px auto;
      }
      .eyebrow,
      footer {
        color: var(--muted);
        font-size: 13px;
      }
      h1 {
        font-size: clamp(26px, 5vw, 36px);
        line-height: 1.25;
        font-weight: 600;
        letter-spacing: -0.03em;
        border-bottom: 1px solid var(--border);
        padding-bottom: 20px;
      }
      h2 {
        font-size: 22px;
        font-weight: 600;
        margin-top: 32px;
      }
      p {
        margin: 18px 0;
      }
      article .chartmd {
        margin: 32px 0;
      }
      button,
      summary {
        cursor: pointer;
      }
      button {
        color: var(--ink);
        background: var(--page);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 14px;
        font: inherit;
        font-size: 13px;
      }
      details {
        margin-top: 36px;
        border-top: 1px solid var(--border);
        padding-top: 20px;
      }
      summary {
        font-weight: 500;
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 360px;
        resize: vertical;
        margin: 16px 0;
        padding: 18px;
        border: 1px solid var(--border);
        background: var(--soft);
        color: var(--ink);
        border-radius: 6px;
        font:
          13px/1.65 ui-monospace,
          monospace;
      }
      footer {
        border-top: 1px solid var(--border);
        padding: 20px 0 36px;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid #7856a6;
        outline-offset: 3px;
      }
      @media (max-width: 540px) {
        .shell {
          padding: 0 18px;
        }
        main {
          margin: 32px auto;
        }
      }
      /*CHART_CSS*/
    </style>
  </head>
  <body>
    <div class="shell">
      <header>
        <strong>chart.md</strong
        ><button id="theme" type="button">Dark theme</button>
      </header>
      <main>
        <p class="eyebrow">A DOCUMENT WITH DATA · DEMO</p>
        <article><!--CONTENT--></article>
        <details>
          <summary>View and edit the Markdown</summary>
          <form method="post" action="/">
            <label for="source">Markdown source</label>
            <textarea id="source" name="source" spellcheck="false">
<!--SOURCE--></textarea>
            <button type="submit">Render document</button>
          </form>
        </details>
      </main>
      <footer>
        Rendered with React Markdown and
        <a href="https://www.npmjs.com/package/@leracherry/chartmd"
          >@leracherry/chartmd</a
        >.
      </footer>
    </div>
    <script>
      const root = document.documentElement;
      const button = document.getElementById('theme');
      function theme(value) {
        root.dataset.theme = value;
        button.textContent = value === 'dark' ? 'Light theme' : 'Dark theme';
        button.setAttribute('aria-pressed', String(value === 'dark'));
      }
      try {
        theme(localStorage.getItem('chartmd-demo-theme') || 'light');
      } catch {
        theme('light');
      }
      button.addEventListener('click', () => {
        theme(root.dataset.theme === 'dark' ? 'light' : 'dark');
        try {
          localStorage.setItem('chartmd-demo-theme', root.dataset.theme);
        } catch {
          /* storage is optional */
        }
      });
    </script>
  </body>
</html>
